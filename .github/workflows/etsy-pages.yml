name: Sync Etsy and publish website
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install token encryption support
        run: pip install 'cryptography>=46,<47'
      - name: Test synchronization
        run: python -m unittest discover -s tests
      - name: Prepare durable portfolio state
        run: python scripts/state_store.py prepare
      - name: Read active and sold Etsy listings
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_STATE_KEY: ${{ secrets.ETSY_STATE_KEY }}
          ETSY_INCLUDE_SOLD: 'true'
        run: python -m scripts.sync_etsy
      - name: Generate catalog HTML
        shell: pwsh
        run: ./build-ceramics.ps1
      - name: Prepare public files
        run: python scripts/stage_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
