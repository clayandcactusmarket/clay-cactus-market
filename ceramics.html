    <header>

            <h1 id="ceramics-heading" class="ceramics__heading">The Collection</h1>
            <p id="ceramics-status" class="ceramics__status" role="status">Loading the collection…</p>
            <ul id="ceramics-grid" class="ceramics-grid"></ul>
            <noscript>
                <p class="ceramics__status">Please enable JavaScript to browse the collection, or <a href="https://www.etsy.com/shop/ClayAndCactusMarket" target="_blank" rel="noopener noreferrer">visit our Etsy shop</a>.</p>

        <div class="contact-divider" aria-hidden="true">
            <img src="assets/cactus-swirls.png" alt="" class="contact-divider-image">
        </div>

        <div class="ceramics-modal__backdrop" data-close></div>
